# nginx sample rules - place in your server config (do not drop into docroot)
# Deny access to sensitive folders and files

location ~* /(\.git|scripts|vendor)/ {
    deny all;
    return 404;
}

# Deny direct access to app configuration
location = /app/config.php {
    deny all;
    return 404;
}

# Prevent access to SQL or backup files
location ~* \.(sql|bak|env)$ {
    deny all;
    return 404;
}
